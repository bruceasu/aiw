schema = 1

[[plugins]]
name = "pkg"
description = "Query repositories, install and update packages, publish releases, and manage Skills."
entrypoint = "aiw-pkg.py"
startup = "python"
help = """
Usage: aiw pkg <command> --help
Commands: list, search, info, show, entries, install, update, remove, purge,
          mark manual, autoremove, index, publish, unpublish, pack, skill.
Skill operations: aiw pkg skill list|discover|adopt|install|sync.
Repository: [repo].url for reads; publish_url for writes (defaults to url).
Adapters: local directory, HTTP(S) reads, S3, SSH. No fallback or dependency downloads.
Install accepts a local ZIP or package name; --version selects an exact version.
update defaults to installed packages; --core/--all also fill release collections.
remove uninstalls and retains configuration; purge also removes registered config.
No historical backups or rollback. Transactions retain only failure recovery data.
Windows locked files: exit related programs; install the main program through the
independent Python entry point documented in docs/usage/aiw-pkg.md.
State: DEST/.aiw/packages/. --dest overrides AIW_INSTALL_DIR and platform default.
"""
